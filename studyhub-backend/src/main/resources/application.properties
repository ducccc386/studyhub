spring.application.name=studyhub

# Render yêu cầu bind đúng PORT được cung cấp qua env var, mặc định 8080 khi chạy local
server.port=${PORT:8080}

# Disable HiddenHttpMethodFilter — prevents 'overrideMethod is not iterable' 500 error on PUT/DELETE
spring.mvc.hiddenmethod.filter.enabled=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studyhub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool - giới hạn thấp để tránh OOM trên Render Free tier (512MB)
# Mỗi connection tốn ~5MB RAM: 5 connections = ~25MB (thay vì 100MB với pool=20)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ddl-auto=none tren Render (DB Aiven da co schema san, khong can Hibernate tu sua bang)
# Doi thanh 'update' khi can them entity moi: set env var DB_DDL=update tren Render roi deploy lai
spring.jpa.hibernate.ddl-auto=${DB_DDL:none}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Disable standard error page stacktraces for security
server.error.include-stacktrace=never

# Allow large base64 JSON payloads
server.tomcat.max-http-form-post-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Cloudinary Config
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:your_cloud_name_here}
cloudinary.api_key=${CLOUDINARY_API_KEY:your_api_key_here}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:your_api_secret_here}

